name: cavt_smart_admissions
description: "CAVT Smart Admissions"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png.jpeg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#8B1118"
  image: "assets/app_icon.png.jpeg"
  android: true
  ios: true
